# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo, then fill in the secret values.
# Blank optional keys switch that feature off (emails log to the console, no OAuth, no checkout).
services:
  - type: web
    name: ott-server
    runtime: node
    rootDir: ott-server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URL
        sync: false
      - key: CLIENT_URL
        sync: false # e.g. https://your-app.vercel.app
      - key: SERVER_URL
        sync: false # e.g. https://ott-server.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: APP_NAME
        value: Streamly
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_READ_TOKEN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
